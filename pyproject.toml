[project]
name = "kikusan"
version = "0.1.0"
description = "Search and download music from YouTube Music with lyrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.12.8",
    "ytmusicapi>=1.8.0",
    "fastapi[standard]>=0.115.0",
    "click>=8.0.0",
    "httpx>=0.27.0",
    "mutagen>=1.47.0",
    "spotipy>=2.24.0",
]

[project.scripts]
kikusan = "kikusan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
