[project]
name = "kikusan"
version = "0.23.1"
description = "Search and download music from YouTube Music with lyrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.12.8",
    "ytmusicapi>=1.8.0",
    "fastapi[standard]>=0.115.0",
    "typer>=0.15.0",
    "httpx>=0.27.0",
    "mutagen>=1.47.0",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.1",
    "croniter>=1.3.0",
    "beautifulsoup4>=4.12.0",
    "billboard.py>=7.1.0",
    "bgutil-ytdlp-pot-provider>=1.0.0",
    "curl-cffi>=0.13.0,<0.16.0",  # yt-dlp's impersonation support currently caps out at 0.15.x
]

[project.scripts]
kikusan = "kikusan.cli:main"

[project.entry-points."kikusan.plugins"]
# Third-party plugins can register here

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
